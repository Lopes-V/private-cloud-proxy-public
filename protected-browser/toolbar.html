<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navegação protegida</title>
  <link rel="stylesheet" href="./toolbar.css">
</head>
<body>
  <header>
    <button id="back" title="Voltar" aria-label="Voltar">◀</button>
    <button id="forward" title="Avançar" aria-label="Avançar">▶</button>
    <button id="reload" title="Atualizar" aria-label="Atualizar">↻</button>
    <button id="home" title="Início" aria-label="Início">⌂</button>
    <form id="address-form" autocomplete="off">
      <input type="text" id="address" aria-label="Endereço HTTPS" placeholder="https://..." spellcheck="false" autocomplete="off">
    </form>
    <span class="protection" title="Proteção de captura do Windows ativada">Protegido</span>
  </header>
  <script src="./toolbar.js"></script>
</body>
</html>
